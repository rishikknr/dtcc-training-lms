services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lms}
      POSTGRES_USER: ${DB_USER:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-lms}
      DB_USER: ${DB_USER:-lms}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${BACKEND_PORT:-8080}:8080"]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
  frontend:
    build: ./frontend
    ports: ["${WEB_PORT:-5173}:8080"]
    depends_on: [backend]
    networks: [internal]
networks:
  internal:
volumes:
  postgres_data:
